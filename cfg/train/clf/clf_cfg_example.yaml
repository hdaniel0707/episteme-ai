# Experiment configuration
# alg_id: unique name for this experiment — determines the output directory under results/
# If omitted, a name is auto-generated from the config filename + timestamp.
alg_id: "A1"
alg_label: "name_of_exp"

seed: 42

data:
  parquet_path: "data/parquet/0515_A_500_AI_260.parquet"   # relative to the project root
  drop_classes: []   # e.g. ["gpt-4o-mini:aggressive"]

features:
  - emb_specter2

model:
  ml_alg: "gradient_boosting"  # gradient_boosting | logistic | svm | mlp 
  n_runs: 3
