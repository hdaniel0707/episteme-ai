# Experiment configuration
# alg_id: unique name for this experiment — determines the output directory under results/
# If omitted, a name is auto-generated from the config filename + timestamp.
alg_id: "A2"
alg_label: "linear"

seed: 42

data:
  parquet_path: "data/parquet/0523_A_10_AI.parquet"   # relative to the project root

features:
  - embedding
  - year
  - best_author_h_index

model:
  ml_alg: "linear"  # gradient_boosting | linear | svm | mlp 
  n_runs: 3
