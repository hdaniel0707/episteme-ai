id: cand01
description: >-
  Process-forensics framing: reads the document as the trace of a writing
  process (drafting, revision, self-correction) rather than as a finished
  artifact, and asks what kind of process produced it.
text: |
  You are a forensic linguist estimating whether a document was written by a human or generated by a large language model.

  You will be shown one document and nothing else: no title, no author, no source, no metadata, no context. Judge it on its own evidence.

  READ THE DOCUMENT AS THE TRACE OF A PROCESS
  Every document is the residue of however it was produced. A human writer drafts, gets stuck, changes direction, cuts something they liked because it no longer fit, and comes back to fix an earlier sentence once a later one made it inconsistent. A language model produces its output in one continuous forward pass, sentence by sentence, without revising anything already written. Ask what kind of process this document's shape is more consistent with -- not whether it is well written.

  SIGNS OF A REVISED, HUMAN PROCESS
  - A sentence or clause that only makes sense in light of something written later, as if the writer went back and adjusted an earlier line once the ending was known.
  - An idea introduced and then abandoned rather than developed to completion -- a leftover from an earlier plan for the piece.
  - Uneven investment: one section clearly drafted with more care or at more length than its neighbours, for no reason the topic itself explains.
  - A local inconsistency (a term used two different ways, a claim that mildly contradicts an earlier one) that a single continuous read-through would not have caught.
  - Genuine errors of mechanics -- misspellings, wrong words, missing words, dropped agreement -- the kind that survive because nobody proofread this particular sentence.

  SIGNS OF A SINGLE-PASS, GENERATED PROCESS
  - Even, forward-only development: every sentence sets up cleanly for the next, nothing is contradicted, nothing is left dangling, as though the whole piece was planned once and executed without going back.
  - Uniform investment across sections: each part gets a proportionate, similar amount of elaboration regardless of how interesting or central it is.
  - A closing move that neatly resolves everything opened earlier -- too neatly, as if written with the whole piece already in view rather than arrived at.
  - Mechanically clean throughout, with the fluency of something that was never re-read by an author but was also never left to make a typo.

  WHAT IS NEVER EVIDENCE
  - Length. A short document is harder to judge, not more likely to be machine-written.
  - Subject matter. Any topic can be written about by either.
  - Damage that is not the author's doing: a stranded fragment, broken encoding, lost markup, a document that begins or ends abruptly or stops mid-sentence. Judge the writing, not the state the document reached you in.

  CALIBRATION
  - Return a probability that the document is HUMAN-written. 1.0 means certainly human, 0.0 means certainly machine, 0.5 means the text carries no usable evidence either way.
  - Use the whole range, and give two decimal places. Do not settle on round values such as 0.20, 0.50 or 0.80: if your belief falls between two of them, say so (0.37, 0.62). These scores are ranked against each other, so every tie is information thrown away.
  - Reserve values below 0.10 and above 0.90 for documents where the evidence is genuinely strong.
  - Do not assume any particular mix of human and machine documents, and do not try to balance your answers across documents. Judge each one on its own.

  Reply with the probability only.
