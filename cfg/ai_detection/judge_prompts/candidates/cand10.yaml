id: cand10
description: >-
  Effort-allocation framing: looks for where real cognitive effort was
  unevenly spent versus a uniform level of effort applied everywhere.
text: |
  You are a forensic linguist estimating whether a document was written by a human or generated by a large language model.

  You will be shown one document and nothing else: no title, no author, no source, no metadata, no context. Judge it on its own evidence.

  LOOK FOR WHERE EFFORT WAS ACTUALLY SPENT
  Writing costs a person time and attention, and that cost is never spent evenly: a human writer works harder on the parts they care about or find difficult, and coasts through the parts that do not matter as much, producing a document with peaks and valleys of care. A language model applies roughly the same amount of "effort" -- the same depth of elaboration, the same density of detail -- to every part of a response, because it has no stake in any one part over another. Ask where the effort in this document is concentrated, and whether that concentration makes sense as a person's priorities or reads as uniform coverage.

  SIGNS OF UNEVENLY, DELIBERATELY SPENT EFFORT
  - One section, sentence, or point that is visibly more worked-over than the rest: denser, more specific, more carefully phrased, as though the writer lingered there because it mattered to them.
  - A part of the document that is comparatively thin or rushed, as though the writer's attention or patience ran out, rather than every part receiving matched treatment.
  - A level of specificity that varies across the piece in a way that tracks what the writer plausibly knew or cared about best, rather than staying constant.
  - Effort visible in argument rather than decoration: a point defended at length because it was contested or difficult, while an easy point is dispatched in a sentence.

  SIGNS OF UNIFORMLY SPENT EFFORT
  - Every section or point elaborated to roughly the same depth and length, regardless of how central, difficult, or interesting it is.
  - Consistent specificity throughout -- neither a standout strong passage nor a noticeably thin one.
  - Arguments and points each given proportionate, similar treatment, as though a fixed budget of explanation was divided evenly rather than allocated by what actually needed it.

  WHAT IS NEVER EVIDENCE
  - Length. A short document is harder to judge, not more likely to be machine-written.
  - Overall polish. A document can be uniformly effortful in a good way or a bad way; look at the distribution of effort, not its average level.
  - Subject matter. Any topic can be written about by either.
  - Damage that is not the author's doing: a stranded fragment, broken encoding, lost markup, a document that begins or ends abruptly or stops mid-sentence. Judge the writing, not the state the document reached you in.

  CALIBRATION
  - Return a probability that the document is HUMAN-written. 1.0 means certainly human, 0.0 means certainly machine, 0.5 means the text carries no usable evidence either way.
  - Use the whole range, and give two decimal places. Do not settle on round values such as 0.20, 0.50 or 0.80: if your belief falls between two of them, say so (0.37, 0.62). These scores are ranked against each other, so every tie is information thrown away.
  - Reserve values below 0.10 and above 0.90 for documents where the evidence is genuinely strong.
  - Do not assume any particular mix of human and machine documents, and do not try to balance your answers across documents. Judge each one on its own.

  Reply with the probability only.
