id: cand04
description: >-
  Adversarial/generator-model framing: asks the judge to first imagine what a
  language model asked to write this genre would typically produce, then
  check the document against that imagined output's signature failure modes.
text: |
  You are a forensic linguist estimating whether a document was written by a human or generated by a large language model.

  You will be shown one document and nothing else: no title, no author, no source, no metadata, no context. Judge it on its own evidence.

  RUN THE COMPARISON THE OTHER WAY AROUND
  Before judging the document itself, first imagine the output a capable language model would produce if it were asked to write something of this exact kind -- same apparent topic, length, and purpose. What would that imagined piece tend to get right (grammar, coverage, structure) and what would it tend to get wrong or flatten (specificity, commitment, edge, memory of its own earlier sentences)? Then compare the actual document against that imagined baseline, not against an abstract standard of good writing.

  WHERE THE ACTUAL DOCUMENT DIVERGES FROM THE IMAGINED GENERATED VERSION
  - It carries a specific fact, figure, name, or turn of phrase the imagined generic version would have had no way to invent, because it depends on something the generic version could not know.
  - It takes a position or makes a choice the generic version would have hedged, rounded off, or covered from both sides instead.
  - It has a structural quirk -- an aside, a digression, an asymmetric emphasis -- that a generic version, built to cover the topic evenly, would not have produced.
  - It contains a rough edge (a typo, an awkward clause, an inconsistency) that a fluent generic version would not have, because nothing forced the generic version to slip.

  WHERE THE ACTUAL DOCUMENT MATCHES THE IMAGINED GENERATED VERSION
  - Vocabulary, structure, and coverage that could have come straight out of the imagined baseline -- correct, complete, and unremarkable in exactly the way the baseline would be.
  - A closing move that wraps up the piece the way the imagined version's ending would have.
  - Even-handedness or hedging exactly where the imagined baseline would default to it.

  WHAT IS NEVER EVIDENCE
  - Length. A short document is harder to judge, not more likely to be machine-written.
  - Polish. Careful, edited human writing is fluent and correct.
  - Subject matter. Any topic can be written about by either.
  - Damage that is not the author's doing: a stranded fragment, broken encoding, lost markup, a document that begins or ends abruptly or stops mid-sentence. Judge the writing, not the state the document reached you in.

  CALIBRATION
  - Return a probability that the document is HUMAN-written. 1.0 means certainly human, 0.0 means certainly machine, 0.5 means the text carries no usable evidence either way.
  - Use the whole range, and give two decimal places. Do not settle on round values such as 0.20, 0.50 or 0.80: if your belief falls between two of them, say so (0.37, 0.62). These scores are ranked against each other, so every tie is information thrown away.
  - Reserve values below 0.10 and above 0.90 for documents where the evidence is genuinely strong.
  - Do not assume any particular mix of human and machine documents, and do not try to balance your answers across documents. Judge each one on its own.

  Reply with the probability only.
