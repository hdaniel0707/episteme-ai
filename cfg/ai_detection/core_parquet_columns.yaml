# Canonical column layout for the 4 core AI-detection parquets
# (ghostbuster_orig, manugram_gb, manugram_sci, manugram_aiscientist).
#
# The model: `canonical_columns` (meta_common + the detector-suite block +
# judge_columns_canonical) is the EXACT, ordered list of column names every
# one of the 4 parquets must carry, identically spelled, identically ordered.
# Nothing here is inferred from shape or pattern-matched -- if a name isn't
# listed, it isn't canonical, full stop. That's on purpose: a shape/pattern
# rule (e.g. "any <model> in judge_model_order times any <prompt> in
# judge_prompt_order") silently accepted combinations that were never
# actually scored everywhere (gemma4_31b_cand03/cand10 only exist on
# manugram_aiscientist) and let real drift (differently-abbreviated ad hoc
# names across files) through uncaught.
#
# A column legitimately specific to one corpus (OpenAlex metadata on
# manugram_sci, `ai_author` on manugram_aiscientist, a one-off judge rerun)
# goes in `per_stem_extra` instead -- allowed there, not required anywhere
# else, never flagged. Position among per_stem_extra columns (and any other
# unrecognized column) isn't enforced, only membership -- ordering is only
# strict within `canonical_columns`.
#
# Read by epai/ai_detection/score/core_columns.py. Checked by
# epai/ai_detection/score/check_core_columns.py.

# --- the 4 core parquets, by stem name --------------------------------------
stems: [ghostbuster_orig, manugram_gb, manugram_sci, manugram_aiscientist]

# --- MG-Reph, opt-in only (check_core_columns.py --only; never swept by a
# bare run, same convention as score_logjudge_ord2.py's REPHRASE_STEMS).
# Both halves are built from a merged/unioned schema (source_family splits
# them, split_manugram_reph.py/rollout variant) -- manugram_reph_sci carries
# manugram_sci's own per_stem_extra fields for real, manugram_reph_gb carries
# the same columns but always null (unioned in from the sci half, never
# populated for Ghostbuster-family rows) -- see per_stem_extra below for both.
rephrase_stems: [manugram_reph_gb, manugram_reph_sci]

# --- meta (required everywhere) ---------------------------------------------
meta_common: [uid, id, domain, text, text_raw, generated_by]

# --- per-stem extra (allowed only there, never required, never flagged) ----
per_stem_extra:
  manugram_sci:
    - doi
    - title
    - author_ids
    - author_count
    - year
    - venue
    - citation_count
    - fwci
    - language
    - fields_of_study
    - query
    - also_matched_domains
    - prompt
  manugram_aiscientist:
    - text_preclean
    - title
    - year
    - oa_id
    - ai_author
  manugram_reph_gb: &rephrase_extra
    - source_family
    - rephrase_len_ratio
    - rephrase_surface_jaccard
    - rephrase_seqmatch_ratio
    - doi
    - title
    - author_ids
    - author_count
    - year
    - venue
    - citation_count
    - fwci
    - language
    - fields_of_study
    - query
    - also_matched_domains
    - prompt
    # NOT listed here on purpose: the 12 live experiment/variant judge
    # columns (_wlp/_slp/_sbc/_lp, ens_v3_smin_*, sonnet5_v3) that
    # run_zeroshot_performance.py etc. read on the 4 CORE parquets --
    # deliberately dropped from manugram_reph_gb/_sci instead (never scored
    # as a real analysis target there; check_core_columns.py --drop-extra).
  manugram_reph_sci: *rephrase_extra

# --- detector-suite column order --------------------------------------------
# Capability-ladder order, copied from cfg/detector_suite.md's figure axis
# (Falcon-7B (2023) -> Falcon3-7B -> Qwen2.5-7B -> Mistral-7B v0.3 -> Llama-3.1-8B).
# WHICH models/pairs exist still comes from cfg/detector_suite.yaml (the
# single source of truth for membership) -- these lists set the column
# ORDER instead of that file's own list order, because detector_suite.yaml
# says plainly its embedders order "is not load-bearing"; it was never meant
# to pin a column position. Every combination here is legitimately exact --
# unlike judges, there's no partial-coverage concept for a Binoculars/
# Fast-DetectGPT pair or an embedder, so generating from these (rather than
# hand-enumerating 34 names) doesn't reintroduce the shape-matching problem.
embedders_order:
  - specter2
  - scincl
  - scibert
  - mpnet
  - minilm
  - e5
  - bge
  - roberta
  - styledistance
  - style_wegmann
  - luar
  - luar_crud

# Shared by binoculars_pairs and fastdetect_pairs -- detector_suite.md keeps
# the two pair lists identical on purpose (same 5 model pairs, one statistic
# swapped), so one order list covers both. Underscored to match column names
# directly (cfg/detector_suite.yaml's keys use hyphens).
model_pair_order:
  - falcon_7b
  - falcon3_7b
  - qwen25_7b
  - mistral_v03
  - llama31_8b

detectors_order:
  - radar

# Stat sub-order within one fastdetect_pairs entry: fastdetect_<stat>_<key>.
fastdetect_stat_order: [crit, prob, ntok]

# Stat sub-order within one detectors entry: detector_<stat>_<name>.
detector_stat_order: [score, ntok]

# --- llm_judge_* columns (required everywhere) ------------------------------
# The EXACT, ordered list of every llm_judge* column every parquet must
# carry -- not generated from a model x prompt cross product (see the header
# comment for why). A judge column that's only real on some corpora belongs
# in per_stem_extra above, not here.
judge_columns_canonical:

  # Judge Scores (gpt56Luna 3x)
  - llm_judge_score_gpt56luna_v3
  - llm_judge_score_gpt56luna_cand03
  - llm_judge_score_gpt56luna_cand10

  # Judge Scores (open-weight models)
  - llm_judge_score_qwen3_14b_v3
  - llm_judge_score_gptoss_120b_v3
  - llm_judge_score_llama33_70b_v3
  - llm_judge_score_gemma4_31b_v3

  # LogJudge Ord2 Raw (gpt56Luna 3x)
  - llm_judge_logprobs_gpt56luna_v3_words
  - llm_judge_logprobs_gpt56luna_cand03_words
  - llm_judge_logprobs_gpt56luna_cand10_words

  # LogJudge Ord2 Raw (gemma)
  - llm_judge_logprobs_gemma4_31b_v3_words

  # LogJudge Ord5 Raw
  - llm_judge_logprobs_gpt56luna_v3_scale
  - llm_judge_logprobs_gemma4_31b_v3_scale

  # LogJudge Ord2 Scores (gpt56Luna 3x) -- score_logjudge_ord2.py, the paper's
  # Eq. logjudge_simple applied to the raw windows above
  - logjudge_ord2_gpt56luna_v3
  - logjudge_ord2_gpt56luna_cand03
  - logjudge_ord2_gpt56luna_cand10

  # LogJudge Ord2 Scores (gemma)
  - logjudge_ord2_gemma4_31b_v3

  # FusionJudge -- score_fusionjudge_gpt56luna_v3.py, mean(llm_judge_score_gpt56luna_v3,
  # logjudge_ord2_gpt56luna_v3); NOT a naming-convention match for either
  # prefix on purpose, it's a cross-readout combination of both
  - fusionjudge_score

  # FusionJudge variants -- score_fusionjudge_variants_gpt56luna_v3.py, two
  # more self-dual combination rules of the same two members (log-odds
  # average, Bayes/product rule). A wider sweep (a tempered gamma family,
  # an agreement-gated blend, and two disagreement-penalizing alternatives)
  # was tried and dropped -- none beat the plain mean at the paper's 1%-FPR
  # operating point; see score_fusionjudge_variants_gpt56luna_v3.py's
  # docstring. fusionjudge_score (the mean) remains the paper's headline
  # fusion.
  - fusionjudge_logodds_score
  - fusionjudge_bayes_score

  # Judge Reasoning
  - llm_judge_cues_human_gpt56luna_v3
  - llm_judge_cues_machine_gpt56luna_v3
  - llm_judge_cuevec_gpt56luna_v3
  - llm_judge_reason_gpt56luna_v3
  - llm_judge_other_gpt56luna_v3


# --- columns allowed to be entirely null/empty ------------------------------
# A canonical column that's null on every row is normally an ERROR (check 6),
# but these are null ON PURPOSE, not a capture bug:
#
# fastdetect_prob_* has real values only for the falcon-7b pair.
# Fast-DetectGPT's criterion-to-probability mapping ships published
# calibration constants for a handful of pairs only, and
# run_fastdetect_pairs.py deliberately writes Null for the rest rather than
# borrow another pair's constants (see that script's "THE PROBABILITY
# COLUMNS ARE MOSTLY NULL, ON PURPOSE" docstring section).
# `fastdetect_crit_*` -- not this -- is the real detector score: it's what
# every calibration/scoring script (calibrate_fastdetect_baseline.py,
# run_fastdetect_youden_calibration.py, run_zeroshot_performance.py) reads,
# and it has no nulls. Nothing reads fastdetect_prob_*.
allow_null:
  - fastdetect_prob_falcon3_7b
  - fastdetect_prob_qwen25_7b
  - fastdetect_prob_mistral_v03
  - fastdetect_prob_llama31_8b

# Primary key column: must be unique within each parquet.
primary_key: uid
