# Treatment arm of the normalisation experiment: the NORMALISED parquets.
#
# Identical to RAW_luar_crud.yaml in every respect except the parquet paths, so
# the two matrices differ only by the text normalisation.
#
# Requires, in order:
#   1. uv run python epai/ai_detection/prepare/normalize_text.py \
#          data/parquet/essay_binox0.parquet data/parquet/reuter_binox0.parquet \
#          data/parquet/wp_binox0.parquet data/parquet/essay_gpt54mini_binox0.parquet \
#          data/parquet/reuter_gpt54mini_binox0.parquet \
#          data/parquet/wp_gpt54mini_binox0.parquet
#      (writes *_norm.parquet with emb_* dropped)
#   2. uv run python epai/ai_detection/embed/add_embeddings.py \
#          data/parquet/<corpus>_norm.parquet --cpu-threads 16 --gpu 0
#      for each of the six, or trim EMBEDDERS in that script to luar_crud only.
#
# PREDICTION: the below-chance cells (macro-F1 0.33-0.37 in the specter2 run)
# rise to ~0.50 and the diagonal falls. A diagonal still at 98% means a second
# artifact survived and step 1 has to be repeated on the normalised text.
alg_id: "NORM_luar_crud"
alg_label: "normalised text + luar_crud"

seed: 42

data:
  human_label: "human"
  group_col: "id"

  datasets:
    - name: "essay"
      label: "essay"
      parquet_path: "data/parquet/essay_binox0_norm.parquet"
      drop_classes: ["claude", "gpt_prompt1", "gpt_prompt2", "gpt_semantic", "gpt_writing"]
    - name: "reuter"
      label: "reuter"
      parquet_path: "data/parquet/reuter_binox0_norm.parquet"
      drop_classes: ["claude", "gpt_prompt1", "gpt_prompt2", "gpt_semantic", "gpt_writing"]
    - name: "wp"
      label: "wp"
      parquet_path: "data/parquet/wp_binox0_norm.parquet"
      drop_classes: ["claude", "gpt_prompt1", "gpt_prompt2", "gpt_semantic", "gpt_writing"]
    - name: "essay_gpt54mini"
      label: "essay (gpt54mini)"
      parquet_path: "data/parquet/essay_gpt54mini_binox0_norm.parquet"
      drop_classes: []
    - name: "reuter_gpt54mini"
      label: "reuter (gpt54mini)"
      parquet_path: "data/parquet/reuter_gpt54mini_binox0_norm.parquet"
      drop_classes: []
    - name: "wp_gpt54mini"
      label: "wp (gpt54mini)"
      parquet_path: "data/parquet/wp_gpt54mini_binox0_norm.parquet"
      drop_classes: []

features:
  - emb_luar_crud

model:
  ml_alg: "logistic"
  n_runs: 3
  test_size: 0.30
