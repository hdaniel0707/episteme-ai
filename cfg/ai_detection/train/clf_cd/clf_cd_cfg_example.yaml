# Cross-domain (transfer) classification experiment.
#
# Every dataset below is trained on in turn and evaluated on ALL of them,
# producing a source x target matrix:
#   diagonal     -> in-domain, held-out grouped test split
#   off-diagonal -> transfer: the model never saw this corpus / this generator
#
# alg_id: unique name for this experiment — determines the output directory under
# results/clf_cd/<experiment_id>/<alg_id>/
alg_id: "A1"
alg_label: "name_of_exp"

seed: 42

data:
  # Labels are binarised to human vs machine: `human_label` -> 0, every other
  # class -> 1. The corpora do not agree on generator names (`gpt` here,
  # `gpt_plain` there), so only this binary view is comparable across them.
  human_label: "human"

  # Column whose rows must stay in the SAME split. In the Ghostbuster corpora the
  # human original and every LLM rewrite of a source document share one `id`.
  # It also guards transfer: `essay` and `essay_gpt54mini` are built from the
  # same human sources and share their ids, so target rows whose group was seen
  # during training are excluded from the evaluation (and the count is reported).
  group_col: "id"

  # A dataset is a parquet plus an optional `domain`, read by
  # epai/utils/corpus_utils.py:
  #
  #   name          short key used in the matrix; must be unique in this file
  #   label         optional, shown on the figures (defaults to `name`)
  #   parquet_path  relative to the project root. May be set ONCE here under
  #                 `data` (see below) and left out of the entries; an entry
  #                 that names its own wins.
  #   domain        optional. One domain of a file built by
  #                 prepare/combine_domains.py. Omit it to use the WHOLE file,
  #                 which is what a per-corpus parquet holds — both forms work,
  #                 and a config written before the combined files still runs.
  #                 A domain that is not in the file is a preflight error that
  #                 lists the ones that are.
  #   drop_classes  optional generators to skip, e.g. ["claude", "gpt_prompt1"].
  #                 Also settable once under `data`. Usually empty now:
  #                 combine_domains.py drops them when the combined file is
  #                 built, so what is on disk is what is used.
  #
  # TWO SHAPES, pick by where the corpora live:
  #
  # (a) every dataset is a domain of ONE file — set the path once:
  #
  #       parquet_path: "data/parquet/ghostbuster_gpt54mini.parquet"
  #       datasets:
  #         - {name: "essay",  domain: "essay"}
  #         - {name: "reuter", domain: "reuter"}
  #         - {name: "wp",     domain: "wp"}
  #
  # (b) the matrix spans SEVERAL files (two generators, or the per-corpus
  #     parquets) — name the file per entry, as below. Mixing a default with
  #     overrides is legal but reads worse than being explicit.
  datasets:
    - name: "essay"
      label: "Essay"
      parquet_path: "data/parquet/ghostbuster_gpt35t.parquet"
      domain: "essay"
    - name: "essay_gpt54mini"
      label: "Essay (gpt54mini)"
      parquet_path: "data/parquet/ghostbuster_gpt54mini.parquet"
      domain: "essay"

features:
  - emb_specter2

model:
  ml_alg: "logistic"  # gradient_boosting | logistic | svm | mlp
  n_runs: 3
  test_size: 0.30     # held-out fraction; used for the in-domain diagonal
