# Cross-domain transfer control for the human-vs-machine classifier.
#
# The three gpt54mini regenerations. Same domains as original_logistic.yaml
# with a newer generator, so the two files' matrices are directly comparable.
#
# Every dataset is one DOMAIN of a combined parquet built by
#   uv run python epai/ai_detection/prepare/combine_domains.py \
#       data/parquet/essay_binox0.parquet data/parquet/reuter_binox0.parquet \
#       data/parquet/wp_binox0.parquet -o data/parquet/ghostbuster_gpt35t.parquet
# which already dropped the generators this experiment does not use, so
# `drop_classes` is empty everywhere. Run with:
#   uv run python epai/ai_detection/train/run_clf_cross_domain.py --cfg cfg/ai_detection/train/clf_cd/ghostbuster/gpt54mini_logistic.yaml
alg_id: "gpt54mini_logistic"
alg_label: "gpt54mini + logistic"

seed: 42

data:
  # Labels are binarised to human vs machine: `human_label` -> 0, every other
  # class -> 1. The corpora do not agree on generator names (`gpt` in the
  # originals, `gpt_plain` in the gpt54mini regenerations), so only this binary
  # view is comparable across them.
  human_label: "human"

  # Column whose rows must stay in the SAME split. `id` is the PAIR key: a
  # source prompt and every rewrite of it share one, and splitting them apart
  # would show the model the same source text on both sides. It also guards
  # transfer -- the originals and their gpt54mini regenerations share ids, so
  # target rows whose group was seen in training are excluded (and counted).
  group_col: "id"

  # Every dataset is one domain of this file, so the path is set once
  # here instead of being repeated per entry. An entry may still name
  # its own `parquet_path` to pull one corpus from somewhere else.
  parquet_path: "data/parquet/ghostbuster_gpt54mini.parquet"

  datasets:
    - name: "essay_gpt54mini"        # short key used in the matrix
      label: "essay (gpt54mini)"      # optional, shown on the figures
      domain: "essay"
    - name: "reuter_gpt54mini"
      label: "reuter (gpt54mini)"
      domain: "reuter"
    - name: "wp_gpt54mini"
      label: "wp (gpt54mini)"
      domain: "wp"

features:
  - emb_specter2

model:
  ml_alg: "logistic"  # gradient_boosting | logistic | svm | mlp
  n_runs: 3
  test_size: 0.30
