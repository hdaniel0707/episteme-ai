# Leave-one-out (pooled) transfer eval for the human-vs-machine classifier.
#
# Unlike the source x target matrix (train on ONE corpus, test on the rest),
# this trains on EVERYTHING EXCEPT one held-out slice and tests on that slice.
# Two complementary folds are produced:
#
#   leave-one-domain-out (LODO)    : hold out a topic/genre (essay | reuter | wp),
#                                    train on the other two (both generators).
#                                    -> "does the detector transfer to a new topic?"
#   leave-one-generator-out (LOGO) : hold out a generator (gpt | gpt54mini),
#                                    train on the other (all topics).
#                                    -> "does the detector transfer to a new model?"
#
# The pooled training set gives the model the domain/generator DIVERSITY that a
# single-source model never sees; this is the honest OOD number to compare against
# the zero-shot Binoculars baseline, which is reported in the same table.
#
# Each held-out slice reports four accuracies on the same footing:
#   model in-domain      : held-out documents of the TRAINING pool (same domains
#                          and generators as training) -- the ceiling.
#   model out-of-domain  : the held-out slice -- the transfer number.
#   binoculars_fitted    : cutoff calibrated on the training pool (Youden's J).
#   binoculars_vanilla_* : cutoff taken straight from this file, fit to nothing.
#
# Each dataset is tagged with `domain` and `generator` so the folds can be built.
alg_id: "ALL_logistic"
alg_label: "ALL + logistic"

seed: 42

# Zero-shot Binoculars reference. Same block, same variant names and the same
# `score <= threshold => machine` rule as the cross-domain scripts, so a
# `binoculars_vanilla_<value>` row means the same thing in both places.
#
#   binoculars_fitted            -> always runs. The cutoff is calibrated by
#                                   Youden's J on the fold's TRAINING pool and
#                                   applied unchanged to the test rows. No model
#                                   is trained, but the threshold still comes
#                                   from labelled data.
#   binoculars_vanilla_<value>   -> one per `vanilla_threshold` below. The cutoff
#                                   comes straight from this file and is used
#                                   everywhere, fit to nothing at all -- the only
#                                   baseline that saw no labels. Omit
#                                   `vanilla_threshold` to skip it; give a list
#                                   to compare several published cutoffs.
#
# 0.9015310749276843 is the cutoff from the Binoculars paper (the accuracy mode;
# the low-FPR mode uses a different one).
binoculars_baseline:
  enabled: true
  column: "binoculars_score"
  vanilla_threshold: [0.9015310749276843, 0.8536432310785527]

data:
  human_label: "human"
  group_col: "id"

  datasets:
    - name: "essay"
      label: "essay"
      domain: "essay"
      generator: "gpt"
      parquet_path: "data/parquet/essay_binox0.parquet"
      drop_classes: ["claude", "gpt_prompt1", "gpt_prompt2", "gpt_semantic", "gpt_writing"]
    - name: "reuter"
      label: "reuter"
      domain: "reuter"
      generator: "gpt"
      parquet_path: "data/parquet/reuter_binox0.parquet"
      drop_classes: ["claude", "gpt_prompt1", "gpt_prompt2", "gpt_semantic", "gpt_writing"]
    - name: "wp"
      label: "wp"
      domain: "wp"
      generator: "gpt"
      parquet_path: "data/parquet/wp_binox0.parquet"
      drop_classes: ["claude", "gpt_prompt1", "gpt_prompt2", "gpt_semantic", "gpt_writing"]
    - name: "essay_gpt54mini"
      label: "essay (gpt54mini)"
      domain: "essay"
      generator: "gpt54mini"
      parquet_path: "data/parquet/essay_gpt54mini_binox0.parquet"
      drop_classes: []
    - name: "reuter_gpt54mini"
      label: "reuter (gpt54mini)"
      domain: "reuter"
      generator: "gpt54mini"
      parquet_path: "data/parquet/reuter_gpt54mini_binox0.parquet"
      drop_classes: []
    - name: "wp_gpt54mini"
      label: "wp (gpt54mini)"
      domain: "wp"
      generator: "gpt54mini"
      parquet_path: "data/parquet/wp_gpt54mini_binox0.parquet"
      drop_classes: []

features:
  - emb_specter2

model:
  ml_alg: "logistic"  # gradient_boosting | logistic | svm | mlp
  n_runs: 3
  # Held-out fraction of document ids used to build a leak-free test split in the
  # leave-one-generator-out fold (where a domain and its rewrite share human ids).
  logo_test_size: 0.30
  # Held-out fraction of the TRAINING pool's document ids, kept back as the
  # in-domain test set. Split by id, so no document lands in both the fit pool and
  # the in-domain test pool via its generator variants.
  indomain_test_size: 0.20
