# Experiment configuration
# alg_id: unique name for this experiment — determines the output directory under results/
# If omitted, a name is auto-generated from the config filename + timestamp.
alg_id: "essay"
alg_label: "essay"

seed: 42

data:
  parquet_path: "data/parquet/essay.parquet"   # relative to the project root
  drop_classes: ["claude","gpt_prompt1","gpt_prompt2","gpt_semantic","gpt_writing"]   # e.g. ["gpt-4o-mini:aggressive"]

features:
  - emb_specter2

model:
  ml_alg: "logistic"  # gradient_boosting | logistic | svm | mlp
  n_runs: 3
