# Experiment configuration
# alg_id: unique name for this experiment — determines the output directory under results/
# If omitted, a name is auto-generated from the config filename + timestamp.
alg_id: "essay_gpt54mini"
alg_label: "essay_gpt54mini"

seed: 42

data:
  parquet_path: "data/parquet/essay_gpt54mini_binox0.parquet"   # relative to the project root
  drop_classes: []   # e.g. ["gpt-4o-mini:aggressive"]
  # Column whose rows must stay in the SAME split (train/val/test).
  # In the Ghostbuster corpora the human original and every LLM rewrite of a
  # source document share one `id`; splitting rows at random would put a
  # document in train and its rewrite in test. Set to null for a plain
  # stratified random split.
  group_col: "id"

features:
  - emb_specter2

model:
  ml_alg: "logistic"  # gradient_boosting | logistic | svm | mlp
  n_runs: 3
