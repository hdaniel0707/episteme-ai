# In-domain classification — the annotated sample config.
#
# The only config in this folder, and both things at once: a working experiment
# (every algorithm on luar_crud, trained on ALL the data) and the reference for
# every key run_clf_in_domain.py accepts. Copy it to start a new experiment; each
# finished run also writes its own config.yaml next to its results.
#
# WHAT THIS ASKS, and what it does not. One corpus, one grouped train/test split:
#
#   "how well does this classifier separate human from machine text HERE"
#
# NOT "does it transfer". The ~97-99% this will report is in-domain only — an
# upper bound on a deployed detector, never an estimate of one. The same feature
# sets and algorithms score far lower on a corpus they did not train on; that is
# the whole point of cfg/ai_detection/train/clf_cd/, and this file is its
# control, not its replacement.
#
# THE TWO AXES are identical to a clf_cd config: a run is the cross product of
# `feature_sets` x `algorithms`, and one element of it is a VARIANT. Every
# `feature_sets` entry is one design matrix, whether it names one column or five.
# Each variant gets its own directory and confusion matrix, and a final
# comparison ranks them all by held-out accuracy.
#
# THE ONE DIFFERENCE from a clf_cd config: `data` IS the corpus, rather than a
# list of corpora to put in a matrix. A `datasets:` list here is a preflight
# error naming the other runner.
#
# Run:
#   uv run python epai/ai_detection/train/run_clf_in_domain.py            # this file
#   uv run python epai/ai_detection/train/run_clf_in_domain.py --dry-run  # preflight only
#   uv run python epai/ai_detection/train/run_clf_in_domain.py --cfg <other.yaml>

# alg_id names the output directory under results/clf_id/<experiment_id>/<alg_id>/.
# It must be unique across the configs run together, or two of them would write
# into the same place.
alg_id: "luar_crud_all"
alg_label: "luar_crud — all data, in-domain"

seed: 42

# ---------------------------------------------------------------------------
# The corpus (ONE — this is the whole difference from a clf_cd config)
# ---------------------------------------------------------------------------

data:
  parquet_path: "data/parquet/ghostbuster_gpt54mini_10w.parquet"

  # Labels are binarised to human vs machine: `human_label` -> 0, every other
  # class -> 1. Corpora disagree on generator names (`gpt` here,
  # `gpt56luna:0701A` there), so only this binary view is comparable across runs.
  human_label: "human"

  # Column whose rows must stay in the SAME split. In the Ghostbuster corpora the
  # human original and every LLM rewrite of a source document share one `id`, so
  # splitting on anything else would put a document on both sides of the cut and
  # inflate the score.
  group_col: "id"

  # WHICH ROWS  ← uncomment `where` to train on a SUBSET instead of everything
  #
  # where: {domain: [essay, wp]}     # <- essay and wp only
  # where: {domain: essay}           # <- one domain
  # where: {domain: essay, generated_by: [human, gpt]}   # <- and one generator
  #
  # A mapping of column -> the value, or list of values, to KEEP; several columns
  # are ANDed. Any column works, not just `domain` — that is simply the one
  # combine_domains.py writes. Values are compared as strings, and one that is
  # not in the file is a preflight error listing the ones that are. Do NOT write
  # `where: {}` to mean "everything": an empty mapping keeps no rows and the
  # preflight rejects it. Omit the key entirely instead.
  #
  # Omitted here, so this run trains on ALL the data in the file — every domain,
  # every generator. `domain: essay` (no `where:`) is kept as shorthand for
  # `where: {domain: essay}`.

  # Optional generators to drop, e.g. ["claude", "gpt_prompt1"] — the complement
  # of `where`: what to remove rather than what to keep. Usually empty now:
  # combine_domains.py drops them when the combined file is built.
  drop_classes: []

# ---------------------------------------------------------------------------
# The feature axis
# ---------------------------------------------------------------------------

# One design matrix per entry. An entry takes any of three forms:
#
#   - emb_luar_crud                            a one-column matrix
#   - [emb_luar_crud, binoculars_score]        one matrix, both columns stacked
#   - {columns: [...], id: ..., label: ...}    the same, named explicitly
#
# Column names are taken LITERALLY — nothing is prefixed for you. A column
# missing from the file is a preflight error, raised before any training starts.
feature_sets:
  - emb_luar_crud

# Several entries compare representations, all on the same rows and split:
#
# feature_sets:
#   - emb_specter2
#   - emb_luar_crud
#   - emb_mpnet
#
# ...and because an entry may stack several columns, one run can ablate what a
# set contains — the same embedding with and without the detector score:
#
# feature_sets:
#   - emb_luar_crud
#   - {columns: [emb_luar_crud, binoculars_score], id: luar_binox, label: "LUAR + Binoculars"}

# Extra columns appended to EVERY feature set. They shift all variants equally,
# so the comparison stays fair. Usually empty.
extra_features: []

# LEAKAGE SANITY CHECK / positive control. Text columns listed here are binarised
# human-vs-machine (human -> 0, any generator -> 1, the same rule as the target)
# and appended to EVERY feature set as a 0/1 feature. `generated_by` binarises to
# the label itself, so a working pipeline scores ~100%; anything less points to a
# bug in the split / scaling / eval path. Leave empty ([]) for real experiments —
# this deliberately leaks the answer.
extra_binary_text: []

# ---------------------------------------------------------------------------
# The algorithm axis
# ---------------------------------------------------------------------------

# One held-out score per entry, so the run costs
# len(feature_sets) x len(algorithms) x n_runs fits. Each entry is a registry key
# from epai/algs (logistic | svm | gradient_boosting | simple_mlp | binox_mlp),
# or a mapping:
#   name   -> the registry key
#   id     -> optional; output-folder name, so one algorithm can appear twice
#             with different params without a collision (defaults to `name`)
#   label  -> optional; shown on the figures (defaults to `name`)
#   params -> optional; only names the algorithm actually reads are accepted —
#             the preflight rejects anything else instead of ignoring it, so a
#             block copied out of a sweep leaderboard either takes effect or
#             fails loudly. The resolved set (yours plus the defaults) is printed
#             before each result and saved as `resolved_params`.
#   binoculars -> optional; a column name (or `true` for `binoculars_score`)
#             handed to the algorithm as a SECOND input beside the feature set.
#             Only algorithms built for it accept one (currently binox_mlp).
#             Such an entry is a HYBRID, marked with a ◆ in the ranking because
#             it sees more than the shared feature set. The column never enters
#             the design matrix, but it does join the missing-value filter, so
#             every algorithm here still trains and is scored on identical rows.
algorithms:
  - name: logistic
    label: "Logistic Regression"
    params: {C: 1.0, max_iter: 1000}
  - name: svm
    label: "SVM (RBF)"
    params: {C: 1.0, kernel: "rbf", gamma: "scale"}
  - name: simple_mlp
    label: "Simple MLP"
    params:
      hidden_dims: [256, 64]
      dropout: 0.1
      epochs: 100
      batch_size: 64
      lr: 0.001
      weight_decay: 0.0001
      patience: 10

model:
  n_runs: 3           # seeds; every number is the mean ± std over them
  test_size: 0.30     # held-out fraction

# ---------------------------------------------------------------------------
# Describing the split
# ---------------------------------------------------------------------------

# Columns to break the train/test split down by, reported per value as counts and
# shares and drawn as a panel on the comparison figure.
#
# These are NEVER features: they are read and kept aligned with the design matrix
# so the run can describe itself, and never stacked into it. Putting `domain`
# here tells you whether the held-out half looks like the training half; putting
# it in `feature_sets` would hand the model the answer.
#
# Worth setting whenever a run pools several subsets, which is the default here:
# the split is grouped by `id` but NOT stratified, so a column's proportions hold
# only in expectation (about ±1.6 points per domain at this size). Without this
# nothing in the output says what the actual split was.
report_by: [domain, generated_by]

# ---------------------------------------------------------------------------
# Optional zero-shot score baselines
# ---------------------------------------------------------------------------

# No classifier is trained by either family; each variant becomes one more ★ row
# in the comparison, the fixed reference the trained variants are measured
# against. Same split and seeds as the trained variants. Drop the key or set
# enabled: false to skip a family.
#
#   <kind>_fitted            -> the cutoff is calibrated on the TRAINING half
#                               (Youden's J) and applied to the held-out half.
#   <kind>_vanilla_<value>   -> one per `vanilla_threshold`, taken straight from
#                               this file and fit to nothing at all.
#
# Both read LOW = machine: Binoculars by construction, the LLM judge because it
# reports P(human). 0.9015310749276843 is the cutoff from the Binoculars paper
# (accuracy mode); the judge's `vanilla_threshold` defaults to 0.5.
binoculars_baseline:
  enabled: true
  column: "binoculars_score"
  vanilla_threshold: [0.9015310749276843]

# The judge only scores the generators it was asked for, so rows with a Null
# score drop out of THIS baseline (and only this one) — the preflight prints the
# scored/unscored row counts and errors out if what is left is single-class.
llm_judge_baseline:
  enabled: false
  column: "llm_judge_score_gpt54_mini"
  vanilla_threshold: [0.5]

# ---------------------------------------------------------------------------
# Preflight guards (checked before training; never affect the fitting itself)
# ---------------------------------------------------------------------------

# Refuse to start if a feature set keeps fewer than this many usable rows. Guards
# against a column that exists but is mostly Null, which would otherwise train on
# a handful of rows and still look like a full run.
min_rows: 50

# Warn (do not abort) when a class is rarer than this share of the corpus. The
# figures are read against a 50% chance line, which stops being the right anchor
# once the classes are badly skewed — and on the whole file, unfiltered, the
# class balance is whatever the corpus happens to be.
min_class_share: 0.10
