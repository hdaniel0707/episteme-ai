# trainv2 · experiment 1 — data-generator effectiveness (in-domain)
#
# For every generator in the multi parquet, train `human` vs that generator over
# the embedding x algorithm grid below, once per domain and once pooled, with a
# grouped 70/30 split repeated over `seeds`. Report AUROC and TPR@1%FPR (oracle,
# i.e. threshold fit on the held-out rows). Each training is one point in the
# (AUROC, TPR@1%FPR) scatter grid the runner draws.
#
# Run:
#   uv run python epai/ai_detection/trainv2/run_in_domain.py
#   uv run python epai/ai_detection/trainv2/run_in_domain.py --dry-run

name: gen_effectiveness_science_v3f

# THE MULTI PARQUET. Must carry `human` + >=2 generators, one row per
# (source paper, generator), all four rows of a paper sharing one `id`.
parquet: data/parquet/science_v3f_multi_0811A.parquet

group_col: id          # human abstract + every rewrite of it share this
human_label: human     # -> y = 0; any generator -> y = 1
domain_col: domain     # each domain sliced on its own, plus a pooled slice

# The embedding axis — one design matrix per column (rows of the scatter grid).
# emb_roberta: the winner of emb_effectiveness_science_v3f.yaml (embedding
# comparison, logistic only) — top of the ranking on both AUROC and TPR@1%FPR,
# and consistently so across all three generators individually.
embeddings:
  - emb_roberta

# The algorithm axis — columns of the scatter grid. Plain classifiers only;
# an algorithm that needs an auxiliary column is rejected here.
algorithms:
  - {name: logistic, label: "Logistic Regression", params: {C: 1.0, max_iter: 1000}}
  - {name: svm,      label: "SVM (RBF)",           params: {C: 1.0, kernel: rbf, gamma: scale}}
  # - {name: simple_mlp, label: "Simple MLP", params: {hidden_dims: [256], epochs: 120,
  #    normalize: standard, dropout: 0.2, lr: 0.0003, batch_size: 128, patience: 15, val_frac: 0.0}}

seeds: [0, 1, 2]
test_size: 0.30
fpr: 0.01              # the FPR the TPR is read at
