# Calibrated by calibrate_judge_baseline.py on science_v3_multi_0811A.parquet
# target FPR 0.01, pooled over every domain ('all').
# Read by cd_core.baseline_entries() / run_judge_performance.py.
llm_judge_baseline:
  columns:
  - column: llm_judge_score_gpt56luna_v3
    threshold: 0.17
    label: gpt56luna
  - column: llm_judge_score_gptoss_120b_v3
    threshold: 0.21
    label: gptoss_120b
  - column: llm_judge_score_llama33_70b_v3
    threshold: 0.17
    label: llama33_70b
  - column: llm_judge_score_qwen3_14b_v3
    threshold: -.inf
    label: qwen3_14b
