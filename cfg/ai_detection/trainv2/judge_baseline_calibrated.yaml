# Calibrated by calibrate_judge_baseline.py on MG-All (gb_orig+mg_gb+mg_sci+mg_den), pooled ('all')
# 'threshold' = 0.01-FPR cut, pooled over every domain ('all').
# 'threshold_youden' = Youden's J cut (recorded; cd_core reads 'threshold').
# Read by cd_core.baseline_entries().
llm_judge_baseline:
  columns:
  - column: llm_judge_score_gemma4_31b_v3
    threshold: 0.12
    threshold_youden: 0.43
    label: gemma4_31b
  - column: llm_judge_score_gemma4_31b_v3_lp
    threshold: 2.6e-05
    threshold_youden: 0.999972
    label: gemma4_31b_lp
  - column: llm_judge_score_gpt56luna_v3
    threshold: 0.07
    threshold_youden: 0.18
    label: gpt56luna
  - column: llm_judge_score_gptoss_120b_v3
    threshold: 0.17
    threshold_youden: 0.64
    label: gptoss_120b
  - column: llm_judge_score_llama33_70b_v3
    threshold: 0.18
    threshold_youden: 0.27
    label: llama33_70b
  - column: llm_judge_score_qwen3_14b_v3
    threshold: 0.1
    threshold_youden: 0.37
    label: qwen3_14b
