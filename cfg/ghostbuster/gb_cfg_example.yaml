# Ghostbuster corpus with a newer generator — one config for the whole pipeline.
#
# Same arrangement as cfg/science_data/: every stage reads this single file, so
# the model that produced the text, the parquet names derived from it, and the
# scoring knobs cannot drift apart between stages.
#
# Run the whole pipeline with one command:
#   uv run python epai/ghostbuster/run_full_pipeline.py --yes --gpu 0
#
# ...or a stage at a time, in pipeline order:
#   uv run python epai/ghostbuster/run_full_pipeline.py --only generate
#   uv run python epai/ghostbuster/run_full_pipeline.py --from collect
#
# ...or stop before the GPU stages and finish them later, elsewhere:
#   uv run python epai/ghostbuster/run_full_pipeline.py --until standardize --yes
#   uv run python epai/ghostbuster/run_full_pipeline.py --from score --gpu 0
#
# BEFORE THE FIRST RUN the shared inputs must be seeded by hand into
# external/ghostbuster/data/ — see "Ghostbuster (new-generator corpus)" in the
# README. The pipeline never writes them: human text and prompts are what makes
# two model variants comparable, so regenerating them is a mistake worth being
# unable to make by accident.

# Names the combined corpus: data/parquet/<dataset_id>_<variant>.parquet, where
# <variant> is derived from the model below. Keep it "ghostbuster" unless this
# is a different corpus rather than a different generator — the existing files
# are ghostbuster_gpt35t.parquet and ghostbuster_gpt54mini.parquet.
dataset_id: "x_ghostbuster"

# ------------------------------------------------------------- generate ----
# Runs external/ghostbuster/generate.py, once per domain, in the fork's own uv
# environment. Every loop there skips an output file that already exists, so
# re-running this stage costs nothing for work already done and is the way to
# finish an interrupted run.
generate:
  # The OpenAI model for the gpt_* types. <variant> is its slug — gpt-5.6-luna
  # becomes gpt56luna — so this value alone decides every filename below.
  gpt_model: "gpt-5.6-luna"

  # Only used when "claude" appears in `types`; ignored otherwise.
  claude_model: "claude-sonnet-5"

  # Which of the fork's generators to run. gpt_plain is the one built for
  # detector datasets (no markdown, no formatting tells). "human" and "prompts"
  # are NOT valid here — they are the seeded inputs, not outputs.
  #
  # Available: gpt, gpt_prompt1, gpt_prompt2, gpt_writing, gpt_semantic,
  #            gpt_plain, claude
  types: ["gpt_plain"]

  # The prompt-config id for each type in `types`, and the only hand-written
  # half of a row's identity. Every generated row is labelled
  # <model_slug>:<prompt_id> — gpt56luna:0701A — the same convention
  # cfg/science_data/ uses, and the fork writes that run into
  # data/<domain>/gpt56luna_0701A/ (a colon is not a directory name).
  #
  # WHY THIS IS TYPED AND THE MODEL IS NOT: the prompts live in the fork, in
  # external/ghostbuster/utils/prompt_utils.py, and `types` names an INDEX into
  # them (gpt_plain is prompts[6]). Nothing here can read them, so nothing here
  # can derive their version. Ids are <MMDD><letter>: the date the prompts were
  # written, plus a letter for that day's variants.
  #
  # 0701A is the fork's plain prompt as it stands, unchanged since the
  # gpt54mini corpus — which is why that corpus is labelled gpt54mini:0701A. The
  # shared id is the point: same prompts, different model, so the two corpora
  # are comparable. CHANGE THE PROMPTS IN THE FORK AND YOU MUST CHANGE THE ID,
  # or two different prompts end up wearing one name with no way to tell them
  # apart afterwards.
  prompt_ids:
    gpt_plain: "0701A"

  # Which Ghostbuster domains to build. Order is fixed by the pipeline, not by
  # this list. Dropping one drops it from the combined corpus too.
  domains: ["essay", "wp", "reuter"]

  # Cap the number of items per domain, for a smoke test. null = the full 1000.
  # --gen-limit on the command line overrides this, which is the better way to
  # do a one-off test run: the config keeps saying what the real corpus is.
  #
  # Two things to know before reading a limited run's output:
  #   - the fork's --limit does not mean the same thing everywhere. For essay/wp
  #     it is a document count; for reuter it caps the flattened (author, index)
  #     list, so limit: 10 gives ten articles by ONE author, not ten authors.
  #   - the human side is NOT limited. The whole seeded human tree is collected,
  #     so limit: 10 yields ~1000 human rows against 10 generated ones per
  #     domain. Fine for testing the pipeline, useless as a small corpus.
  limit: null

  # Passed through as generate.py --seed. It only affects the perturbation
  # stages, which this pipeline does not run; kept so the command is complete.
  seed: 0

  # Concurrent API calls inside one generate.py invocation. The fork used to
  # issue them one at a time, which is why a full run took an order of magnitude
  # longer than the science pipeline's — that one has run at 8 workers all along
  # (see science_cfg_example.yaml), and this matches it.
  #
  # Safe by construction, not by luck: each call is a stateless request whose
  # prompt is built before it is submitted, so two in flight share nothing and
  # cannot mix one document's inputs into another's. What DOES cap this is the
  # account's rate limit — a 429 costs a retry with backoff, so past some point
  # raising it makes the run slower, not faster.
  #
  # --workers on the command line overrides this. 1 restores the old sequential
  # behaviour.
  max_workers: 8

  # Re-run fix_empty_generations.py after generating, to refill files that came
  # back blank. Costs one API call per empty file and nothing when there are
  # none.
  fix_empty: true

  # Upstream Ghostbuster's reuter/essay post-processing: drop the reply's first
  # line when it contains "sure", "certainly" or "title", meant to remove chat
  # preambles ("Sure, here's a 150-word essay:") and "Title:" headers, which are
  # formatting tells a detector would learn instead of the writing.
  #
  # FALSE, because as written it costs far more than it removes:
  #   - the test is a SUBSTRING match on the whole first line, so it fires on
  #     "ensure", "measure", "pressure", "entitled";
  #   - the first line is checked AFTER blank lines are collapsed, so for a
  #     single-paragraph reply the first line IS the whole document.
  # Measured against the human corpus, ~9% of essay and ~3% of reuter first
  # paragraphs contain one of those substrings — i.e. that share of generations
  # lost their opening paragraph, silently, with no empty file to notice.
  #
  # NOTE FOR COMPARABILITY: this was upstream's behaviour continuously since
  # 2023, so ghostbuster_gpt35t and ghostbuster_gpt54mini were both built with
  # it ON. A corpus generated with it off differs from those in post-processing
  # as well as in model. wp never had it and is unaffected either way.
  strip_boilerplate: false

# -------------------------------------------------------------- prepare ----
# Runs epai/ai_detection/prepare/prepare_{essay,wp,reuter}.py over the collected
# text tree, one parquet per domain: data/parquet/<domain>_<variant>.parquet
prepare:
  # Compute emb_specter2 while preparing. false leaves the column Null for the
  # embed stage to fill at the end, over the whole corpus in one pass, which is
  # both faster and the only order in which every emb_* column comes from the
  # same text. If you set this true, also set combine.drop_incomplete to "emb".
  embeddings: false

# -------------------------------------------------------------- combine ----
# Runs epai/ai_detection/prepare/combine_domains.py: the per-domain parquets
# become one file with a `domain` column.
combine:
  # Rows whose generated_by is one of these are dropped. Empty list = keep
  # every label, which is what you want for a corpus that only holds the types
  # listed above — the script's own default drops the prompt-variant labels and
  # would report each one as "matched nothing". Note the labels here are the
  # corpus ones (gpt56luna:0701A), not the fork's type names.
  drop_generated_by: []

  # "none" is required while prepare.embeddings is false: the emb_specter2
  # column exists but is entirely Null, so any other mode drops every row.
  drop_incomplete: "none"

  # Guard on drop_incomplete; inert while it is "none".
  max_drop_frac: 0.05

  # Delete data/parquet/<domain>_<variant>.parquet once they are in the combined
  # file. They are an intermediate: every row is in the combined corpus with a
  # `domain` column saying which file it came from, nothing downstream reads
  # them, and keeping them stores the corpus twice while leaving three files
  # that look like corpora of their own — which is how a training run ends up
  # pointed at a stale one. Rebuilding them is a prepare run over the collected
  # text tree: local, minutes, no API calls.
  #
  # Only ever after combine exits 0 AND its output is on disk. Set false to keep
  # them, e.g. while iterating on one domain's prepare script.
  remove_domain_parquets: true

# ---------------------------------------------------------- standardize ----
# Runs epai/ai_detection/prepare/standardize_text.py over the combined corpus,
# rewriting `text` IN PLACE for every row — human and generated alike — before
# anything reads it.
#
# WHY THIS STAGE EXISTS. The two classes reach the parquet by different routes:
# the human side through generate.py's per-domain formatting loops, the AI side
# straight out of the model. Anything one route does and the other does not is a
# feature about the route, not about authorship. Measured on the human side of
# this corpus:
#
#     wp/human      1000 docs   curly quotes   4.3%   en/em dash   6.1%
#     essay/human    994 docs   curly quotes  90.2%   en/em dash  18.4%
#     reuter/human  1000 docs   curly quotes   0.0%   en/em dash   0.0%
#
# One generator produced the AI side of all three, so its rate is roughly
# constant. "Curly quote" therefore means HUMAN in essay and AI in reuter — the
# same feature with the sign reversed between domains, which is precisely what
# drives cross-domain transfer BELOW chance instead of merely to it.
#
# WHAT IT WILL NOT DO: remove text by keyword. No preambles, no titles, no
# section labels, no reference lists. It substitutes characters and normalises
# whitespace, and it verifies its own word count is unchanged before writing —
# see generate.strip_boilerplate above for why that guard is there.
standardize:
  # false keeps whatever typographic conventions each source and the generator
  # happened to use. Only worth doing to reproduce a corpus built before this
  # stage existed — ghostbuster_gpt35t and ghostbuster_gpt54mini both were.
  enabled: true

  # How layout is put on one convention:
  #   lines  one line per paragraph; runs of blank lines collapse to a single
  #          newline. Matches what the human loops already do in all three
  #          domains — and fixes wp, where the human side collapses blank lines
  #          TWICE and the AI side once, making blank-line rate a class label.
  #   flat   the whole document becomes one line. For single-paragraph corpora;
  #          the science pipeline uses this.
  whitespace: "lines"

  # Keep the pre-standardisation text in a `text_raw` column, so the transform
  # can be undone from the corpus alone. Written only when absent, so a second
  # run never replaces the true original with an already-standardised copy.
  # false saves a little space and makes the change irreversible.
  keep_raw: true

# ---------------------------------------------------------------- score ----
# Runs external/Binoculars/score_parquets.py once over the combined corpus, in
# the fork's own uv environment, filling `binoculars_score` IN PLACE — there is
# no second _binox0 file. The stage then reads the column back and fails if the
# scorer reported success without writing it.
score:
  text_column: "text"
  batch_size: 1

  # CUDA_VISIBLE_DEVICES for the scorer, e.g. "0" or "0,1". null leaves the
  # choice to torch. --gpu on the command line overrides this.
  gpu: null

  # Cap the CPU thread pools, so a scoring run does not fight other jobs on a
  # shared box. null = torch's default.
  cpu_threads: null

  # null uses the fork's own defaults (falcon-7b / falcon-7b-instruct). Set
  # both or neither — a mismatched pair is a different detector, and its scores
  # are not comparable with anything already in data/parquet/.
  observer: null
  performer: null

  # Score only the first N rows, for timing a run before committing to it.
  # null = the whole corpus. The output is still a complete copy; rows past the
  # limit simply keep a Null score.
  limit: null

# ---------------------------------------------------------------- embed ----
# Runs epai/ai_detection/embed/add_embeddings.py over the scored corpus, filling
# every emb_* column IN PLACE — an embedding is derived from the text alone, so a
# second file would be the same corpus twice.
embed:
  # Which embedders to run; each one becomes an emb_<name> column. Names are
  # checked in the preflight, so a typo fails before the generation starts
  # rather than at the last stage.
  #
  # null runs add_embeddings.py's own EMBEDDERS list — all fifteen, including
  # openai_small and openai_large, which are BILLED PER ROW. Naming them here is
  # the way to keep that deliberate.
  #
  # Available:
  #   content    specter2  scincl  scibert
  #   semantic   mpnet  minilm  e5  bge  qwen3
  #   raw LM     roberta
  #   style      styledistance  style_wegmann  luar  luar_crud
  #   api        openai_small  openai_large        ← billed
  #
  # This list is every one of them EXCEPT the two OpenAI endpoints (billed per
  # row) and qwen3 (a 4B-parameter encoder — far and away the heaviest of the
  # local models, and the reason for the smaller batch size in
  # BATCH_SIZE_OVERRIDE). Written out rather than left null so that adding an
  # embedder to add_embeddings.py does not silently start billing this run.
  embedders:
    - "specter2"
    - "scincl"
    - "scibert"
    - "mpnet"
    - "minilm"
    - "e5"
    - "bge"
    - "roberta"
    - "styledistance"
    - "style_wegmann"
    - "luar"
    - "luar_crud"

  # Column to embed. Kept separate from score.text_column because the two
  # scripts spell the flag differently (--text-column vs --text-col); set both
  # if you ever score and embed something other than `text`.
  text_col: "text"

  # null keeps the script's per-model batch sizes (128, with smaller values for
  # qwen3/LUAR and larger for the OpenAI endpoints). A number here overrides all
  # of them — lower it if a model runs out of memory on a shared GPU.
  batch_size: null

  # Both null by default; --gpu / --cpu-threads on the command line override
  # them, and apply to the score stage too.
  gpu: null
  cpu_threads: null

  # Embed only the first N rows, for debugging a model. null = the whole corpus.
  limit: null

  # Recompute embedders that already have values. false fills only the holes,
  # which is what a re-run after a crash wants.
  recompute: false
