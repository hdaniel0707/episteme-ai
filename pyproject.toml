[project]
name = "episteme-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adapters>=1.3.0",
    "anthropic>=0.102.0",
    "compressed-tensors>=0.18.0",
    "dotenv>=0.9.9",
    "einops>=0.8.2",
    "google-genai>=2.3.0",
    "gradio-client>=2.5.0",
    "kaleido>=1.3.0",
    "matplotlib>=3.10.9",
    "openai>=2.36.0",
    "packaging>=26.2",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pyarrow>=24.0.0",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.6.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=4.57.6",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Install this project into the environment, not just its dependencies. Without
# it uv treats the tree as a "virtual" project and never installs `epai`, so
# imports only resolve by accident when cwd happens to be the repo root — and
# `python path/to/script.py` (which puts the *script's* directory on sys.path,
# not cwd) fails outright. Making it a real package means any venv rebuild
# reinstates the editable install on its own.
package = true

[tool.setuptools.packages.find]
where = ["."]
# Scope the search, or setuptools walks every sibling of `epai` looking for
# packages — here that is ~15GB of old/, data/ and store/, which is what made
# an editable install of one pure-python package take minutes.
include = ["epai*"]
