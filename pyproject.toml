[project]
name = "episteme-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adapters>=1.3.0",
    "anthropic>=0.102.0",
    "dotenv>=0.9.9",
    "google-genai>=2.3.0",
    "gradio-client>=2.5.0",
    "kaleido>=1.3.0",
    "matplotlib>=3.10.9",
    "openai>=2.36.0",
    "packaging>=26.2",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "psutil>=5.9.0",
    "pyarrow>=24.0.0",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=4.57.6",
    "umap-learn>=0.5.12",
]

# Hold torch at 2.11.0 (the version this repo was built on). Without this, the Windows CUDA
# index below would resolve torch UP to a newer release. This is a constraint, so the
# dependency line above ("torch>=2.11.0") is left exactly as it was.
[tool.uv]
constraint-dependencies = ["torch==2.11.0"]

# Portable GPU pin for torch. On Windows we pull torch from the PyTorch CUDA 12.6 index so
# NVIDIA cards (incl. Pascal/GTX 10xx) get the GPU build; that wheel still imports fine on a
# Windows box without an NVIDIA GPU (it just reports cuda=False and runs on CPU). On every
# OTHER platform (Linux/macOS, Radeon, no CUDA) the marker does not match, so torch resolves
# from the default index exactly as before - no +cu126, no crash. All code paths guard with
# torch.cuda.is_available(), so a CPU fallback is always safe.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
